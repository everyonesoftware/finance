name: Build and publish container

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: services-publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set application version
        id: version
        run: echo "version=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Test application
        run: npm test

      - name: Install browser for web verification
        run: npx playwright install --with-deps chromium

      - name: Test production web app
        run: npm run test:browser

  publish:
    outputs:
      services_artifact: ${{ steps.services_capture.outputs.artifact }}
    name: Publish container to GHCR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set application version
        id: version
        run: echo "version=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/everyonesoftware/finance
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-

      - name: Set up Node.js for Services payload capture
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build and push image
        id: services_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Capture original Services publication metadata
        id: services_capture
        continue-on-error: true
        env:
          PUBLISHED_DIGEST: ${{ steps.services_push.outputs.digest }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs capture

      - name: Retain original Services payload for notification-only retries
        if: steps.services_capture.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.services_capture.outputs.artifact }}
          path: ${{ runner.temp }}/services-publish/published.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
          archive: true


  services_notify:
    name: Notify Services (publication remains separate)
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && needs.publish.result == 'success' && vars.SERVICES_PUBLISH_NOTIFICATIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require original payload artifact
        env:
          PAYLOAD_ARTIFACT: ${{ needs.publish.outputs.services_artifact }}
        run: test -n "$PAYLOAD_ARTIFACT"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.publish.outputs.services_artifact }}
          path: ${{ runner.temp }}/services-publish
          digest-mismatch: error
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: ${{ vars.TAILSCALE_TAGS }}
          log-mode: quiet
      - name: Send the retained original payload without rebuilding
        env:
          SERVICES_PUBLISH_URL: ${{ vars.SERVICES_PUBLISH_URL }}
          SERVICES_PUBLISH_TOKEN: ${{ secrets.SERVICES_PUBLISH_TOKEN }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs send
