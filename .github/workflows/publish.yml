name: Build and publish Finance

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_native:
        description: Publish selected native packages (off builds validation artifacts only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: services-publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set application version
        id: version
        run: echo "version=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Test application
        run: npm test

      - name: Install browser for web verification
        run: npx playwright install --with-deps chromium

      - name: Test production web app
        run: npm run test:browser

  publish:
    outputs:
      services_artifact: ${{ steps.services_capture.outputs.artifact }}
    name: Publish container to GHCR
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set application version
        id: version
        run: echo "version=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/everyonesoftware/finance
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-

      - name: Set up Node.js for Services payload capture
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Node.js for Services payload capture
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Node.js for Services payload capture
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Node.js for Services payload capture
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build and push image
        id: services_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}













      - name: Capture original Services publication metadata
        id: services_capture
        continue-on-error: true
        env:
          PUBLISHED_DIGEST: ${{ steps.services_push.outputs.digest }}
          PUBLISHED_TAGS: ${{ steps.metadata.outputs.tags }}
          APP_VERSION: ${{ steps.version.outputs.version }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs capture

      - name: Retain original Services payload for notification-only retries
        if: steps.services_capture.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.services_capture.outputs.artifact }}
          path: ${{ runner.temp }}/services-publish/published.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
          archive: true


  services_notify:
    name: Notify Services (publication remains separate)
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && needs.publish.result == 'success' && vars.SERVICES_PUBLISH_NOTIFICATIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require original payload artifact
        env:
          PAYLOAD_ARTIFACT: ${{ needs.publish.outputs.services_artifact }}
        run: test -n "$PAYLOAD_ARTIFACT"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.publish.outputs.services_artifact }}
          path: ${{ runner.temp }}/services-publish
          digest-mismatch: error
      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: ${{ vars.TAILSCALE_TAGS }}
          log-mode: quiet
      - name: Send the retained original payload without rebuilding
        env:
          SERVICES_PUBLISH_URL: ${{ vars.SERVICES_PUBLISH_URL }}
          SERVICES_PUBLISH_TOKEN: ${{ secrets.SERVICES_PUBLISH_TOKEN }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs send

  native_selection:
    name: Select native builds
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.select.outputs.version }}
      android: ${{ steps.select.outputs.android }}
      windows: ${{ steps.select.outputs.windows }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish_native }}
        run: node scripts/native-release.mjs select

  android:
    name: Build Android
    needs: [verify, native_selection]
    if: needs.native_selection.outputs.android == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.publish_native)
    uses: everyonesoftware/workflows-common/.github/workflows/build-android-v1.yml@100e95c135baaa10e6995efe2538939f86f9c29b
    with:
      build-script: scripts/build-finance-android.sh
      version: ${{ needs.native_selection.outputs.version }}
      artifact-name: finance-android-${{ github.run_id }}
      artifact-path: dist/native/android
      signing-enabled: ${{ github.event_name == 'push' || inputs.publish_native }}
    secrets:
      keystore-base64: ${{ (github.event_name == 'push' || inputs.publish_native) && secrets.FINANCE_KEYSTORE_BASE64 || '' }}
      keystore-password: ${{ (github.event_name == 'push' || inputs.publish_native) && secrets.FINANCE_KEYSTORE_PASSWORD || '' }}
      key-alias: ${{ (github.event_name == 'push' || inputs.publish_native) && secrets.FINANCE_KEY_ALIAS || '' }}
      key-password: ${{ (github.event_name == 'push' || inputs.publish_native) && secrets.FINANCE_KEY_PASSWORD || '' }}

  windows:
    name: Build Windows
    needs: [verify, native_selection]
    if: needs.native_selection.outputs.windows == 'true' || (github.event_name == 'workflow_dispatch' && !inputs.publish_native)
    uses: everyonesoftware/workflows-common/.github/workflows/build-windows-v1.yml@100e95c135baaa10e6995efe2538939f86f9c29b
    with:
      build-script: scripts/build-finance-windows.ps1
      version: ${{ needs.native_selection.outputs.version }}
      artifact-name: finance-windows-${{ github.run_id }}
      artifact-path: dist/native/windows

  native_release:
    name: Publish native release
    needs: [verify, native_selection, android, windows]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.publish_native) &&
      needs.verify.result == 'success' && needs.native_selection.result == 'success' &&
      (needs.android.result == 'success' || needs.android.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      (needs.android.result == 'success' || needs.windows.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.android.result == 'success'
        with:
          name: finance-android-${{ github.run_id }}
          path: dist/native/android
          digest-mismatch: error
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.windows.result == 'success'
        with:
          name: finance-windows-${{ github.run_id }}
          path: dist/native/windows
          digest-mismatch: error
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.native_selection.outputs.version }}
          RELEASE_ANDROID: ${{ needs.android.result == 'success' }}
          RELEASE_WINDOWS: ${{ needs.windows.result == 'success' }}
        run: node scripts/native-release.mjs publish
