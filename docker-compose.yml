services:
  app:
    container_name: finance
    image: ghcr.io/everyonesoftware/finance
    build:
      context: .
    ports:
      - "8080:3000"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
      DATABASE_PATH: /data/finance.sqlite
      NODE_ENV: production
      PORT: 3000
    volumes:
      - finance-data:/data
    restart: unless-stopped

volumes:
  finance-data:
