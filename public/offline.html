<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <title>Finance — Disconnected</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #f5f6f3; color: #202a24; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 420px; }
    .brand { font-size: 18px; font-weight: 650; color: #35654b; }
    h1 { font-size: 30px; line-height: 1.2; letter-spacing: -.03em; }
    p { color: #59635b; }
    button { margin-top: 12px; min-height: 44px; padding: 10px 24px; border: 0; border-radius: 8px; background: #35654b; color: white; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #35654b; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">Finance</div>
    <h1>You’re disconnected</h1>
    <p>Connect to the internet to use Finance. Your financial information isn’t stored for offline access.</p>
    <button type="button" onclick="window.location.reload()">Retry connection</button>
  </main>
</body>
</html>
